<body>
    <div id="ui">
        <b>Gestaltix Fluid Sheets</b><br>
        <div style="margin-top: 10px; display: flex; justify-content: space-between;">
            <input type="text" id="img-url" placeholder="Image URL...">
            <button id="add-btn">Add</button>
        </div>
        <button id="audio-btn">Enable System Audio (Master Volume)</button>
        <ul id="img-list"></ul>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true, alpha: false }); 
        
        let width, height;
        let particles = [];
        const numParticles = 20000; 
        const focalLength = 350; 
        
        const imageSources = [
            'https://images.pexels.com/photos/12802135/pexels-photo-12802135.png'
        ];
        
        let currentImageIndex = 0;
        let targetPixels = [];
        let currentImageData = null;
        
        let state = 'loading'; 
        let stateTimer = 0;
        let globalTime = 0;
        
        let audioContext;
        let analyser;
        let dataArray;
        let smoothedDataArray;
        let audioIntensity = 0;
        let audioHistory = 0;
        
        let lastCachedAlpha = -1;
        let lastCachedColor = "";
        
        let gatherLerp = 0; // Smoothly fades in the audio reactivity during gathering so it doesn't pop
        
        function renderImageList() {
            const list = document.getElementById('img-list');
            list.innerHTML = '';
            imageSources.forEach((src, index) => {
                const li = document.createElement('li');
                const displaySrc = src.length > 25 ? src.substring(0, 25) + '...' : src;
                li.innerHTML = `<span><a href="${src}" target="_blank" style="color:#aaa; text-decoration:none;">${displaySrc}</a></span> <button class="remove-btn" onclick="removeImage(${index})">X</button>`;
                list.appendChild(li);
            });
        }
        
        document.getElementById('add-btn').addEventListener('click', () => {
            const urlInput = document.getElementById('img-url');
            if (urlInput.value.trim() !== '') {
                imageSources.push(urlInput.value.trim());
                urlInput.value = '';
                renderImageList();
            }
        });
        
        document.getElementById('audio-btn').addEventListener('click', async () => {
            if (audioContext) return;
            try {
                // SOFTWARE MODE: This request is intercepted by Electron!
                // It fetches the Windows Master Volume silently without ANY pop-ups!
                const stream = await navigator.mediaDevices.getDisplayMedia({ 
                    video: true, 
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    } 
                });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                
                // We only want the audio track!
                const audioTracks = stream.getAudioTracks();
                if (audioTracks.length > 0) {
                    const audioStream = new MediaStream([audioTracks[0]]);
                    const source = audioContext.createMediaStreamSource(audioStream);
                    source.connect(analyser);
                    
                    dataArray = new Uint8Array(analyser.frequencyBinCount);
                    smoothedDataArray = new Float32Array(analyser.frequencyBinCount);
                    
                    const btn = document.getElementById('audio-btn');
                    btn.innerText = 'Master Volume Connected!';
                    btn.style.background = 'rgba(255, 255, 255, 0.8)';
                    btn.style.color = '#000';
                    btn.style.border = '1px solid #fff';
                } else {
                    alert('No Master Volume stream found.');
                }
            } catch (err) {
                console.error('Error accessing audio:', err);
                alert('Could not access Master Volume.');
            }
        });
        
        window.removeImage = function(index) {
            imageSources.splice(index, 1);
            if (currentImageIndex >= imageSources.length) {
                currentImageIndex = 0;
            }
            renderImageList();
        };
        
        renderImageList();
        
        class Particle {
            constructor(index) {
                this.index = index;
                this.x = (Math.random() - 0.5) * 4000;
                this.y = (Math.random() - 0.5) * 4000;
                this.z = (Math.random() - 0.5) * 4000;
                
                this.vx = 0;
                this.vy = 0;
                this.vz = 0;
                
                this.baseTargetX = 0;
                this.baseTargetY = 0;
                this.baseTargetZ = 0;
                
                this.nextBaseTargetX = 0;
                this.nextBaseTargetY = 0;
                this.nextBaseTargetZ = 0;
                
                this.targetDist = 0;
                this.targetAngle = 0;
                
                this.isBorder = false;
                
                // 25% of particles will buzz/dither chaotically based on the master volume
                this.isDither = Math.random() > 0.75;
                this.ditherFactor = Math.random() * 8 + 2; 
                
                this.baseAlpha = 0.5;
                this.nextBaseAlpha = 0.5;
                
                this.baseSize = Math.random() * 2.0 + 1.0;
                if (Math.random() > 0.95) this.baseSize += 2.0; 
                this.size = this.baseSize;
                this.targetBaseSize = this.baseSize; 
                this.nextTargetBaseSize = this.baseSize;
                
                this.spring = 0.004 + Math.random() * 0.004; 
                this.friction = 0.85 + Math.random() * 0.08; 
            }
            
            update(time) {
                // SMOOTH IMAGE-TO-IMAGE MORPHING:
                // PERFORMANCE BOOST: We only recompute intense math (sqrt/atan2) if the particle is actively moving!
                let dx = this.nextBaseTargetX - this.baseTargetX;
                let dy = this.nextBaseTargetY - this.baseTargetY;
                
                if (Math.abs(dx) > 0.1 || Math.abs(dy) > 0.1) {
                    this.baseTargetX += dx * 0.015;
                    this.baseTargetY += dy * 0.015;
                    this.baseTargetZ += (this.nextBaseTargetZ - this.baseTargetZ) * 0.015;
                    this.targetBaseSize += (this.nextTargetBaseSize - this.targetBaseSize) * 0.015;
                    this.baseAlpha += (this.nextBaseAlpha - this.baseAlpha) * 0.015;
                    
                    // Dynamically recompute polar geometry ONLY when actively morphing
                    this.targetDist = Math.sqrt(this.baseTargetX**2 + this.baseTargetY**2);
                    this.targetAngle = Math.atan2(this.baseTargetY, this.baseTargetX);
                }
                
                // 1. GOLDEN RATIO & FIBONACCI FLOW (Seeded by Picture Data)
                // We pull from currentSimConfig which smoothly transitions between picture seeds.
                let conf = window.currentSimConfig || window.simConfig || { amp1: 89, amp2: 34, spd1: 0.0002, spd2: 0.0004, vDir: 1, vStr: 4.0, gMul: 0.02 };
                const PHI = 1.6180339887;
                const GOLDEN_ANGLE = 2.39996323; // Nature's seed distribution angle
                
                // Deep currents mapped to the unique image pseudo-seed
                let wave1X = Math.sin(this.baseTargetY * (0.002 * PHI) + time * conf.spd1) * conf.amp1;
                let wave1Y = Math.cos(this.baseTargetX * (0.002 * PHI) + time * (conf.spd1 * PHI)) * conf.amp1;
                
                // Turbulence currents mapped to the unique image pseudo-seed
                let wave2X = Math.sin(this.baseTargetX * (0.002 * PHI * PHI) - time * conf.spd2) * conf.amp2;
                let wave2Y = Math.cos(this.baseTargetY * (0.002 * PHI * PHI) - time * (conf.spd2 * PHI)) * conf.amp2;
                
                // Golden Spiral Vortex perfectly tuned by the picture data seed
                let goldenPhase = this.targetDist * GOLDEN_ANGLE * conf.gMul;
                let vortexAngle = this.targetAngle + goldenPhase + Math.sin(this.targetDist * 0.003 - time * 0.0003) * (conf.vStr * conf.vDir);
                
                // Scaled safely to maintain the strict visual bounds
                let scale = 0.45;
                
                let distX = Math.cos(vortexAngle) * (this.targetDist * scale) + wave1X + wave2X;
                let distY = Math.sin(vortexAngle) * (this.targetDist * scale) + wave1Y + wave2Y;
                
                // Depth driven by the primary picture seed
                let distZ = this.baseTargetZ * PHI + Math.sin((this.baseTargetX + this.baseTargetY) * (0.003 * PHI) + time * 0.0003) * (conf.amp1 * 1.5);
                let distSize = this.targetBaseSize;
                
                // 2. Global Sine Floating (the gathered figure gracefully breathes as one connected body)
                let globalFloatX = Math.cos(time * 0.0008) * 30;
                let globalFloatY = Math.sin(time * 0.0011) * 30;
                let globalFloatZ = Math.sin(time * 0.0009) * 50;
                
                let prisX = this.baseTargetX + globalFloatX;
                let prisY = this.baseTargetY + globalFloatY;
                let prisZ = this.baseTargetZ + globalFloatZ;
                let prisSize = this.targetBaseSize;
                
                if (analyser && smoothedDataArray) {
                    // Map this specific particle to one of the 128 frequency bins (FFT) from the master volume
                    // We use modulo so all 20,000 particles are evenly mapped across bass, mid, and treble!
                    let freqIndex = this.index % smoothedDataArray.length;
                    let myFreq = smoothedDataArray[freqIndex] / 255; 
                    
                    // Specific Frequency Distortion
                    distSize += (myFreq * 5.0);
                    distZ += (myFreq * 100); // Bass/Treble pushes particles outward in 3D depth
                    
                    if (this.isBorder) {
                        distX += Math.cos(vortexAngle) * (myFreq * 120);
                        distY += Math.sin(vortexAngle) * (myFreq * 120);
                        
                        let shake = myFreq * 100;
                        prisX += Math.cos(this.targetAngle) * shake;
                        prisY += Math.sin(this.targetAngle) * shake;
                        prisZ += (Math.random() - 0.5) * shake * 0.5;
                        
                        prisSize += (myFreq * 6);
                    } else {
                        prisSize += (myFreq * 2.5);
                    }
                }
                
                // 3. Mathematical Interpolation
                let targetX = distX + (prisX - distX) * gatherLerp;
                let targetY = distY + (prisY - distY) * gatherLerp;
                let targetZ = distZ + (prisZ - distZ) * gatherLerp;
                let targetSize = distSize + (prisSize - distSize) * gatherLerp;
                
                // 4. Global Sine Rotation
                let rotAngle = Math.sin(time * 0.0005) * 0.35; 
                let cosA = Math.cos(rotAngle);
                let sinA = Math.sin(rotAngle);
                
                let finalTargetX = targetX * cosA - targetZ * sinA;
                let finalTargetZ = targetZ * cosA + targetX * sinA;
                let finalTargetY = targetY;
                
                // 5. Constant Spring Physics Integration with micro Sine-Flutter
                let ax = (finalTargetX - this.x) * this.spring;
                let ay = (finalTargetY - this.y) * this.spring;
                let az = (finalTargetZ - this.z) * this.spring;
                
                this.vx += ax;
                this.vy += ay;
                this.vz += az;
                
                // MASTER VOLUME DITHER: Reacts exclusively to the particle's assigned frequency bin!
                if (this.isDither && analyser && smoothedDataArray) {
                    let freqIndex = this.index % smoothedDataArray.length;
                    let myFreq = smoothedDataArray[freqIndex] / 255;
                    
                    if (myFreq > 0.05) {
                        let buzz = myFreq * this.ditherFactor * 1.5;
                        this.vx += (Math.random() - 0.5) * buzz;
                        this.vy += (Math.random() - 0.5) * buzz;
                        this.vz += (Math.random() - 0.5) * buzz;
                    }
                }
                
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vz *= this.friction;
                
                // Aquatic Sine Flutter gives the final integration a deeply fluid flow
                let flutter = Math.sin(time * 0.002 + this.x * 0.01) * 0.15;
                this.vx += flutter;
                this.vy += flutter;
                
                this.x += this.vx;
                this.y += this.vy;
                this.z += this.vz;
                
                this.size += (targetSize - this.size) * 0.2;
            }
            
            draw() {
                // HOLOGRAPHIC CONTAINMENT:
                // Push the entire structure 2000 units deep into the "black box".
                // This makes it physically impossible for any particle to ever fly past the lens or "behind the eyes"!
                // We multiply by 6.7 to optically zoom the camera lens so the figure still perfectly fills the center stage.
                let zDepth = focalLength + this.z + 2000;
                let scale = (focalLength / Math.max(50, zDepth)) * 6.7;
                
                let px = width / 2 + this.x * scale;
                let py = height / 2 + this.y * scale;
                let pSize = this.size * scale;
                
                let alpha = Math.min(1, Math.max(0, 1 - ((this.z + 500) / 4000)));
                
                let edgeDistX = Math.min(px, width - px);
                let edgeDistY = Math.min(py, height - py);
                let minEdgeDist = Math.min(edgeDistX, edgeDistY);
                
                if (minEdgeDist < 150) {
                    alpha *= Math.max(0, minEdgeDist / 150);
                }
                
                let outAlpha = Math.round(alpha * 20) / 20;
                
                if (px > 0 && px < width && py > 0 && py < height && pSize > 0.1 && outAlpha > 0) {
                    // PERFORMANCE BOOST: Eliminated String Parsing
                    // We no longer build and cache `rgba()` strings per particle.
                    // Instead, we just multiply the structural alpha into the global alpha,
                    // and use a globally locked #ffffff color!
                    let finalAlpha = Math.round((alpha * (this.baseAlpha || 1.0)) * 20) / 20;
                    
                    if (finalAlpha !== lastCachedAlpha) {
                        ctx.globalAlpha = finalAlpha;
                        lastCachedAlpha = finalAlpha;
                    }
                    // Color state caching is completely gone! Context is natively locked to white in animate()
                    
                    ctx.fillRect(px - pSize/2, py - pSize/2, pSize, pSize);
                }
            }
        }
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if(particles.length === 0) initParticles();
        }
        
        function initParticles() {
            particles = [];
            for (let i = 0; i < numParticles; i++) {
                particles.push(new Particle(i));
            }
        }
        
        function generateFallbackImage(index) {
            const tempCanvas = document.createElement('canvas');
            const tw = tempCanvas.width = width;
            const th = tempCanvas.height = height;
            const tCtx = tempCanvas.getContext('2d');
            
            tCtx.fillStyle = 'black';
            tCtx.fillRect(0, 0, tw, th);
            tCtx.fillStyle = 'white';
            
            if (index % 3 === 0) {
                tCtx.beginPath();
                tCtx.arc(tw/2, th/2, Math.min(tw, th) * 0.15, 0, Math.PI*2);
                tCtx.fill();
            } else if (index % 3 === 1) {
                tCtx.save();
                tCtx.translate(tw/2, th/2);
                tCtx.rotate(Math.PI / 4);
                tCtx.fillRect(-100, -100, 200, 200);
                tCtx.restore();
            } else {
                tCtx.font = 'bold 80px sans-serif';
                tCtx.textAlign = 'center';
                tCtx.textBaseline = 'middle';
                tCtx.fillText('GESTALT', tw/2, th/2);
            }
            
            return tCtx.getImageData(0, 0, tw, th);
        }
        
        function processImageData(imageData, isFirst = false, cropBox = null) {
            currentImageData = imageData;
            const pixels = imageData.data;
            targetPixels = [];
            
            const step = 2; 
            
            const getB = (ix, iy) => {
                if (ix < 0 || ix >= width || iy < 0 || iy >= height) return 0;
                const idx = (iy * width + ix) * 4;
                return (pixels[idx] + pixels[idx+1] + pixels[idx+2]) / 765; 
            };
            
            const threshold = 0.12; 
            
            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    
                    if (cropBox) {
                        if (x < cropBox.x + 4 || x > cropBox.x + cropBox.w - 4 ||
                            y < cropBox.y + 4 || y > cropBox.y + cropBox.h - 4) {
                            continue;
                        }
                    }
                    
                    let brightness = getB(x, y);
                    
                    if (brightness > threshold) {
                        let isBorder = (
                            getB(x - step*3, y) <= threshold || 
                            getB(x + step*3, y) <= threshold || 
                            getB(x, y - step*3) <= threshold || 
                            getB(x, y + step*3) <= threshold
                        );
                        
                        targetPixels.push({x: x, y: y, b: brightness, isBorder: isBorder});
                    }
                }
            }
            
            if (targetPixels.length > 0) {
                // PSEUDORANDOM IMAGE DATA SEEDING (1 of 50 Unique Flow Profiles)
                // We analyze the picture's pixel distribution to generate a deterministic random seed!
                let dataHash = 0;
                let stepSize = Math.max(1, Math.floor(targetPixels.length / 100));
                for (let i = 0; i < targetPixels.length; i += stepSize) {
                    dataHash += targetPixels[i].x * 11 + targetPixels[i].y * 17 + targetPixels[i].b * 100;
                }
                
                // Map the image data to one of 50 unique "best fit" simulation profiles
                let seedIndex = Math.floor(dataHash) % 50; 
                
                // Deterministic pseudo-random number generator driven by the image's seed
                const prng = (s) => { let x = Math.sin(s + 12.9898) * 43758.5453; return x - Math.floor(x); };
                
                window.simConfig = {
                    seed: seedIndex,
                    amp1: 60 + prng(seedIndex) * 60, // 60 to 120 (Clamped for containment)
                    amp2: 20 + prng(seedIndex + 1) * 30, // 20 to 50
                    spd1: 0.0001 + prng(seedIndex + 2) * 0.0002,
                    spd2: 0.0002 + prng(seedIndex + 3) * 0.0003,
                    vDir: prng(seedIndex + 4) > 0.5 ? 1 : -1, // Clockwise vs Counter-clockwise
                    vStr: 1.0 + prng(seedIndex + 5) * 4.0, // Vortex tightness
                    gMul: 0.01 + prng(seedIndex + 6) * 0.04 // Golden ratio distribution
                };
                console.log("Picture Data Seeded to Sim Profile:", seedIndex, window.simConfig);
                
                for (let i = 0; i < particles.length; i++) {
                    // Uniformly distribute the particles across the available image pixels
                    let targetIndex = Math.floor((i / particles.length) * targetPixels.length);
                    const target = targetPixels[targetIndex];
                    
                    particles[i].nextBaseTargetX = target.x - width / 2;
                    particles[i].nextBaseTargetY = target.y - height / 2;
                    
                    let intensity = target.b; 
                    particles[i].nextBaseTargetZ = intensity * 200 - 100; 
                    particles[i].isBorder = target.isBorder;
                    
                    particles[i].nextBaseAlpha = 0.2 + (intensity * 0.8); 
                    particles[i].nextTargetBaseSize = 1.5 + (intensity * 3.5); 
                    
                    // Only instantly snap if this is the very first image loading
                    if (isFirst || particles[i].baseTargetX === 0 && particles[i].baseTargetY === 0) {
                        particles[i].baseTargetX = particles[i].nextBaseTargetX;
                        particles[i].baseTargetY = particles[i].nextBaseTargetY;
                        particles[i].baseTargetZ = particles[i].nextBaseTargetZ;
                        particles[i].targetBaseSize = particles[i].nextTargetBaseSize;
                        particles[i].baseAlpha = particles[i].nextBaseAlpha;
                        
                        particles[i].targetDist = Math.sqrt(particles[i].baseTargetX**2 + particles[i].baseTargetY**2);
                        particles[i].targetAngle = Math.atan2(particles[i].baseTargetY, particles[i].baseTargetX);
                        
                        let twistAngle = particles[i].targetAngle + Math.sin(particles[i].targetDist * 0.003) * 2.5;
                        let warpX = Math.sin(particles[i].baseTargetY * 0.015) * 150;
                        let warpY = Math.cos(particles[i].baseTargetX * 0.015) * 150;
                        let warpZ = Math.sin((particles[i].baseTargetX + particles[i].baseTargetY) * 0.01) * 300;
                        
                        particles[i].x = Math.cos(twistAngle) * (particles[i].targetDist * 1.2) + warpX;
                        particles[i].y = Math.sin(twistAngle) * (particles[i].targetDist * 1.2) + warpY;
                        particles[i].z = particles[i].baseTargetZ * 2 + warpZ - 200;
                    }
                }
            }
        }
        
        function loadNextImage(isFirst = false) {
            if (imageSources.length === 0) {
                const imgData = generateFallbackImage(currentImageIndex);
                processImageData(imgData, isFirst, null);
                currentImageIndex++;
                
                state = 'breathing'; 
                stateTimer = 0;
                return;
            }
            
            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.onload = () => {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = width;
                tempCanvas.height = height;
                const tCtx = tempCanvas.getContext('2d');
                
                const safeZone = 0.65; 
                const scale = Math.min((width * safeZone) / img.width, (height * safeZone) / img.height);
                const iw = img.width * scale;
                const ih = img.height * scale;
                const ix = (width - iw) / 2;
                const iy = (height - ih) / 2;
                
                tCtx.fillStyle = 'black'; 
                tCtx.fillRect(0, 0, width, height);
                tCtx.drawImage(img, ix, iy, iw, ih);
                
                let cropBox = { x: ix, y: iy, w: iw, h: ih };
                
                try {
                    // Browsers will throw a fatal SecurityError here if the image URL lacks CORS headers!
                    let imgData = tCtx.getImageData(0, 0, width, height);
                    processImageData(imgData, isFirst, cropBox);
                } catch (e) {
                    console.error('CORS Taint Error: Cannot read image data from this URL. Using fallback.', e);
                    const fallbackData = generateFallbackImage(currentImageIndex);
                    processImageData(fallbackData, isFirst, null);
                }
                
                state = 'breathing'; 
                stateTimer = 0;
            };
            img.onerror = () => {
                console.error('Failed to load image:', imageSources[currentImageIndex]);
                const imgData = generateFallbackImage(currentImageIndex);
                processImageData(imgData, isFirst, null);
                
                state = 'breathing';
                stateTimer = 0;
            }
            
            if (currentImageIndex >= imageSources.length) {
                currentImageIndex = 0;
            }
            
            img.src = imageSources[currentImageIndex];
            currentImageIndex = (currentImageIndex + 1) % imageSources.length;
        }
        
        function animate(time) {
            globalTime = time;
            
            // Smoothly morph the mathematical parameters of the fluid between different image seeds!
            if (window.simConfig) {
                if (!window.currentSimConfig) {
                    window.currentSimConfig = JSON.parse(JSON.stringify(window.simConfig));
                } else {
                    let lerpSpeed = 0.015; // Slowly morph the entire math simulation
                    window.currentSimConfig.amp1 += (window.simConfig.amp1 - window.currentSimConfig.amp1) * lerpSpeed;
                    window.currentSimConfig.amp2 += (window.simConfig.amp2 - window.currentSimConfig.amp2) * lerpSpeed;
                    window.currentSimConfig.spd1 += (window.simConfig.spd1 - window.currentSimConfig.spd1) * lerpSpeed;
                    window.currentSimConfig.spd2 += (window.simConfig.spd2 - window.currentSimConfig.spd2) * lerpSpeed;
                    window.currentSimConfig.vDir += (window.simConfig.vDir - window.currentSimConfig.vDir) * lerpSpeed;
                    window.currentSimConfig.vStr += (window.simConfig.vStr - window.currentSimConfig.vStr) * lerpSpeed;
                    window.currentSimConfig.gMul += (window.simConfig.gMul - window.currentSimConfig.gMul) * lerpSpeed;
                }
            }
            
            if (analyser && dataArray && smoothedDataArray) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                    smoothedDataArray[i] += (dataArray[i] - smoothedDataArray[i]) * 0.1;
                }
                audioIntensity = (sum / dataArray.length) / 255;
                audioHistory += (audioIntensity - audioHistory) * 0.05;
            }
            
            lastCachedAlpha = -1;
            
            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#030305'; 
            ctx.fillRect(0, 0, width, height);
            
            ctx.globalCompositeOperation = 'lighter';
            // PERFORMANCE BOOST: Lock the color to pure white globally. All shading is now handled strictly via hardware globalAlpha.
            ctx.fillStyle = '#ffffff';
            
            stateTimer++;
            
            // FLAWLESS SINE EASE-IN-OUT TRANSITIONS (Fast Evolution)
            // Reduced timers so the fluid morphs and evolves much faster between pictures
            const transitionDuration = 120; // Used to be 300
            
            if (state === 'breathing') {
                gatherLerp = 0;
                if (stateTimer > 100) {  // Used to be 200
                    state = 'gathering'; 
                    stateTimer = 0; 
                }
            } else if (state === 'gathering') {
                let t = Math.min(1.0, stateTimer / transitionDuration);
                gatherLerp = 0.5 - 0.5 * Math.cos(Math.PI * t); // Sine Ease In-Out
                
                if (stateTimer > transitionDuration + 120) {  // Used to be 150
                    state = 'distorting_out'; 
                    stateTimer = 0; 
                }
            } else if (state === 'distorting_out') {
                let t = Math.min(1.0, stateTimer / transitionDuration);
                gatherLerp = 0.5 + 0.5 * Math.cos(Math.PI * t); // Sine Ease In-Out back to 0
                
                if (stateTimer > transitionDuration + 20) {  // Used to be 50
                    state = 'loading'; 
                    loadNextImage(false); 
                }
            }
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update(globalTime);
                particles[i].draw();
            }
            
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', resize);
        resize();
        
        loadNextImage(true);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
